name: iOS release

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Subir el IPA a App Store Connect
        type: boolean
        default: false

jobs:
  archive:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Compilar sin firma
        if: ${{ inputs.upload != true }}
        run: |
          xcodebuild \
            -project ios/PresionMTB.xcodeproj \
            -scheme PresionMTB \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PresionMTB.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Instalar certificado y perfil
        if: ${{ inputs.upload == true }}
        env:
          CERT_P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          test -n "$CERT_P12" && test -n "$PROFILE" && test -n "$CERT_PASSWORD"
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p temp "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p temp "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k temp "$KEYCHAIN"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/presionmtb.mobileprovision"

      - name: Archivar firmado
        if: ${{ inputs.upload == true }}
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          test -n "$IOS_TEAM_ID"
          xcodebuild \
            -project ios/PresionMTB.xcodeproj \
            -scheme PresionMTB \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PresionMTB.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            archive

      - name: Exportar y subir
        if: ${{ inputs.upload == true }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID" && test -n "$ASC_KEY_P8" && test -n "$IOS_TEAM_ID"
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PresionMTB.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates
          xcrun altool --upload-app --type ios \
            --file "$RUNNER_TEMP/export/PresionMTB.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
